[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run build:hugo -- --baseURL $URL && pnpm run pagefind"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.163.3"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "22"
  PNPM_VERSION = "10.14.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run build:hugo -- --buildFuture --baseURL $DEPLOY_PRIME_URL && pnpm run pagefind"

[context.branch-deploy]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run build:hugo -- --baseURL $DEPLOY_PRIME_URL && pnpm run pagefind"
