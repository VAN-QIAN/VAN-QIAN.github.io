    tagline: "Ph.D. Student in Computer Science"
    description: "Qian Ma is a Ph.D. student in Computer Science at Rensselaer Polytechnic Institute studying reliable multimodal reasoning, visual evidence grounding, knowledge integration, and evidence sufficiency in vision-language models."
