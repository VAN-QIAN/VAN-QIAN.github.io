bio: |
  I am a Ph.D. student in Computer Science at the DAMI Lab, Rensselaer Polytechnic Institute, advised by Prof. [Yao Ma](https://yaoma24.github.io/). My research focuses on multimodal learning and reasoning, vision-language models, multimodal RAG, knowledge-based visual question answering (KB-VQA), and reliable foundation-model evaluation. I also have expertise in graph learning, graph foundation models, graph self-supervised learning, spatio-temporal forecasting, time-series modeling, and urban computing.
